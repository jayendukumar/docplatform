# Environment variables DOCPLATFORM_<UPPERCASE_FIELD> override these values.
# Relative storage paths resolve against this file's directory.
app_name = "Document Platform"
host = "0.0.0.0"
port = 8000
log_level = "info"
db_host = "localhost"
db_port = 5432
db_name = "docplatform"
db_user = "docplatform"
# Local development only. Override for any shared deployment.
db_password = "docplatform-local"
db_connect_timeout_seconds = 5
storage_backend = "local"
local_storage_path = "data/objects"
s3_region = "us-east-1"
s3_prefix = "docplatform"
s3_addressing_style = "path"
s3_timeout_seconds = 5
s3_max_attempts = 2
max_object_bytes = 10485760
max_image_pixels = 100000000
max_pages_per_document = 100
job_timeout_seconds = 30
sync_render_max_blocks = 128
sync_pdf_render_max_blocks = 512
job_cpu_seconds = 20
job_memory_bytes = 805306368
job_max_output_bytes = 5242880
job_worker_enabled = false
job_worker_poll_seconds = 0.5
job_worker_render_count = 1
job_worker_extraction_count = 1
secure_cookies = false
virus_scan_command = []
virus_scan_timeout_seconds = 15
pdf_renderer_command = []
pdf_renderer = "chromium"
chromium_renderer_command = []
prince_renderer_command = []
pdf_renderer_timeout_seconds = 60
ocr_command = []
ocr_timeout_seconds = 120
webhook_allowed_hosts = []
image_allowed_hosts = []
webhook_timeout_seconds = 5
seed_sample = true

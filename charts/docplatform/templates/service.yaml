apiVersion: v1
kind: Service
metadata:
  name: {{ include "docplatform.name" . }}
  labels: {{- include "docplatform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: {{ include "docplatform.name" . }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]

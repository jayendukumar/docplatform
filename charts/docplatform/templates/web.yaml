apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docplatform.name" . }}
  labels: {{- include "docplatform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "docplatform.name" . }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "docplatform.name" . }}}}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, app.serve]
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: DOCPLATFORM_HOST, value: "0.0.0.0"}
            - {name: DOCPLATFORM_DB_HOST, value: {{ .Values.database.host | quote }}}
            - {name: DOCPLATFORM_DB_PORT, value: {{ .Values.database.port | quote }}}
            - {name: DOCPLATFORM_DB_NAME, value: {{ .Values.database.name | quote }}}
            - {name: DOCPLATFORM_DB_USER, value: {{ .Values.database.user | quote }}}
            - {name: DOCPLATFORM_DB_PASSWORD, value: {{ .Values.database.password | quote }}}
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 10}

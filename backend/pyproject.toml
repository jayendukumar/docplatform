[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "docplatform"
version = "0.1.0"
description = "Self-hosted document platform foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "pg8000==1.31.5",
  "boto3==1.43.99",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "moto[s3]==5.2.3", "ruff==0.16.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

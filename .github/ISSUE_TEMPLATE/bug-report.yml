name: Bug report
description: Report a reproducible problem in the document platform.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and customer documents. Follow the repository Code of Conduct.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe steps, endpoint, or fixture that demonstrates the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include platform, browser, Compose image, and relevant configuration versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, test output, or screenshots. Do not include credentials or personal data.

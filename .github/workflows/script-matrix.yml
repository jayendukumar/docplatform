name: deterministic script matrix

on:
  push:
    paths:
      - 'backend/app/rendering.py'
      - 'backend/app/template_logic.py'
      - 'scripts/render_spike.py'
      - 'scripts/build_script_matrix_page.py'
      - 'docs/script-test-matrix.md'
      - 'backend/requirements.lock'
      - '.github/workflows/script-matrix.yml'
  pull_request:
    paths:
      - 'backend/app/rendering.py'
      - 'backend/app/template_logic.py'
      - 'scripts/render_spike.py'
      - 'scripts/build_script_matrix_page.py'
      - 'docs/script-test-matrix.md'
      - 'backend/requirements.lock'
      - '.github/workflows/script-matrix.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned renderer contract dependencies
        run: python -m pip install --requirement backend/requirements.lock
      - name: Rebuild deterministic script report
        run: |
          mkdir -p artifacts
          PYTHONPATH=backend python scripts/render_spike.py > artifacts/script-matrix.json
          python scripts/build_script_matrix_page.py artifacts/script-matrix.json > artifacts/script-test-matrix.md
          diff --unified=0 docs/script-test-matrix.md artifacts/script-test-matrix.md
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/script-matrix.json').read_text())
          assert report['status'] == 'pending-native-review'
          assert report['candidates'] == ['deterministic-html-0.1']
          scripts = set(report['results'][0]['scripts'])
          assert {'arabic', 'hebrew', 'devanagari', 'tamil', 'thai', 'cjk', 'korean', 'latin'} <= scripts
          assert report['results'][0]['missing_glyphs'] == []
          PY
      - name: Upload deterministic report
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-script-matrix
          path: artifacts/script-matrix.json
      - name: Upload generated matrix page
        uses: actions/upload-artifact@v4
        with:
          name: generated-script-matrix-page
          path: artifacts/script-test-matrix.md
